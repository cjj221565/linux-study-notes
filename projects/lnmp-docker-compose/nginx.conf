# 定义一个网站站点 server块，一个server代表一个网站
server {
    listen 80;
    # listen：监听容器内部的80端口，对应compose的 "80:80"，浏览器访问虚拟机80端口就进这里
    server_name localhost;
    # 站点名称，本地测试写localhost，访问虚拟机IP同样生效；线上这里填域名

    root /usr/share/nginx/html;
    # 网站根目录：容器内存放网页代码的文件夹
    # ✅ 和docker-compose挂载 ./html:/usr/share/nginx/html 完全对应，不会报404！

    index index.php index.html;
    # 默认首页：访问网站根目录，优先加载 index.php，找不到就加载 index.html

    # location ~ \.php$ 正则匹配，所有以 .php 结尾的url请求
    location ~ \.php$ {
        fastcgi_pass php:9000;
        # ✅核心：把php请求转发给php容器的9000端口
        # php 是docker-compose里php服务的名字，同网络内docker会自动解析成php容器IP
        fastcgi_index index.php;
        # fastcgi默认首页文件
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 传递参数，告诉php-fpm要执行的php文件完整路径
        # $document_root 就是上面root设置的目录；$fastcgi_script_name 是请求的文件名
        include fastcgi_params;
        # 引入nginx内置的fastcgi通用参数文件，补齐通信需要的一堆变量
    }
}


