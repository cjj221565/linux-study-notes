version: '3.3'
# compose语法版本，3.8支持下面所有配置
# 老版本不支持3.8 支持3.3

services:
# services：定义所有容器服务，一共3个：mysql、nginx、php
  mysql:
  # mysql服务，服务名mysql，容器之间通信就写这个名字
    image: mysql:8.0
    # 使用mysql8.0镜像来创建容器
    container_name: lnmp-mysql
    # 自定义容器名字，docker ps可以直接看到lnmp-mysql，方便操作
    env_file: .env
    # 读取当前目录.env文件，加载数据库账号密码等环境变量
    volumes:
      - mysql-data:/var/lib/mysql
      # 命名卷：保存mysql数据库数据，删除容器数据不会丢失
      - ./mysql-backup:/backup
      # 绑定挂载：宿主机mysql-backup文件夹映射容器内/backup，用来放数据库备份文件
    ports:
      - "3306:3306"
      # 端口映射：宿主机3306映射容器内部3306，外部工具可连接数据库
    restart: always
    # 重启策略：容器崩溃、虚拟机重启，自动拉起容器

  nginx:
  # nginx服务，web服务器，接收浏览器请求
    image: nginx:alpine
    # alpine版本nginx，镜像体积很小，轻量
    container_name: lnmp-nginx
    # 自定义容器名称lnmp-nginx
    ports:
      - "80:80"
      # 端口映射：宿主机80端口映射容器内80，浏览器访问虚拟机IP:80访问网站
    volumes:
      - ./html:/usr/share/nginx/html
      # 绑定挂载：宿主机html文件夹映射容器内网页根目录，网页代码放宿主机html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # 绑定挂载：宿主机nginx.conf挂载进容器，替换默认站点配置
    depends_on:
      - php
      # 依赖：先启动php容器，再启动nginx容器
      # ⚠️坑：只控制容器启动先后，不等php应用就绪！面试可以主动提这个点
    restart: always
    # 容器异常自动重启

  php:
  # php服务，php-fpm，负责解析php动态代码
    image: php:fpm-alpine
    # php-fpm alpine轻量镜像，用来处理php请求
    container_name: lnmp-php
    # 自定义容器名称lnmp-php
    volumes:
      - ./html:/usr/share/nginx/html
      # 绑定挂载：宿主机html目录挂载进php容器，php读取网页代码
    depends_on:
      - mysql
      # 依赖：先启动mysql容器，再启动php容器
      # ⚠️坑：仅控制容器启动顺序，不会等mysql数据库初始化完成
    restart: always
    # 容器异常自动重启

volumes:
  mysql-data:
  # 声明命名卷mysql-data，上面mysql服务用到了这个命名卷，必须在这里声明version: '3.8'
# compose语法版本，3.8支持下面所有配置

