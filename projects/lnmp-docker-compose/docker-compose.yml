  # 声明命名卷mysql-data，上面mysql服务用到了这个命名卷，必须在这里声明

# docker-compose.yml  四大框架
# version: '3.7'
# services:    # 核心：写所有容器服务
#   服务名:
#     image:
#     restart: 容器崩了想自动重启
#     env_file: 环境变量 需要传参数 密码等
#     ports: 端口 宿主机端口：容器端口 外部访问
#     volumes: 挂载 
#     networks:
#     depends_on: 依赖关系 多个容器有先后启动关系

# networks:    # 可选：自定义网络  多个容器互相访问，想方便通信 
# volumes:     # 可选：命名数据卷  服务里加了volumes 外面也要加

# 举例：
# 需求：搭建 LNMP 环境
# 部署 Nginx、PHP、MySQL 三个组件
# 浏览器可以访问网页
# MySQL 数据不能因为删容器丢失
# 修改 Nginx 配置不用进容器内部
# 数据库密码不要写在代码里
# 容器挂了自动重启

# 翻译：
# 需要 Nginx、PHP、MySQL 三个软件 → services 下面写 3 个服务
# 浏览器访问网页 → Nginx 需要端口映射 ports: "80:80"
# MySQL 数据不能丢 → MySQL 加volumes命名卷，并且在 yml 底部声明 volumes
# 外部修改 nginx 配置文件 → Nginx 增加 volumes 绑定挂载，把宿主机 nginx.conf 挂载进容器
# 密码不写 yml → MySQL 加env_file读取.env
# 容器崩溃自动拉起 → 每个服务加restart: always
# 三个容器互相访问 → 新建自定义 networks，三个服务都接入网络

# 需要跑哪些软件？ → services 写几个服务
# 外部（浏览器 / 宿主机）要不要访问这个服务？ → 需要就加 ports
# 这个服务的数据 / 配置文件要不要保存？ → 需要就加 volumes，判断是绑定挂载还是命名卷
# 容器挂了，要不要自动重启？ → 需要加 restart
# 需要传入密码、环境变量吗？ → 需要加 env_file /environment
# 多个容器之间需要互相通信吗？ → 自定义 networks
# 容器有没有启动先后依赖？ → 加 depends_on